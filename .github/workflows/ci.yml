name: CI

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@main
        with:
          deno-version: "2.1.9"
      - name: lint
        run: |
          deno lint
